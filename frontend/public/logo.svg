<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" role="img" aria-label="Nexora HR">
  <defs>
    <linearGradient id="nxLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- N mark: three vertical bars connected by diagonal -->
  <g>
    <!-- Left bar -->
    <rect x="4" y="8" width="6" height="32" rx="3" fill="url(#nxLogoGrad)"/>
    <!-- Diagonal connector -->
    <polygon points="10,8 16,8 26,40 20,40" fill="url(#nxLogoGrad)"/>
    <!-- Right bar -->
    <rect x="20" y="8" width="6" height="32" rx="3" fill="url(#nxLogoGrad)"/>
    <!-- Teal accent dot – top right -->
    <circle cx="30" cy="11" r="4" fill="#0D9488" opacity="0.85"/>
  </g>
  <!-- Wordmark -->
  <text x="44" y="32" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700" letter-spacing="-0.5" fill="#1E1B4B">Nexora</text>
  <text x="130" y="32" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="400" letter-spacing="-0.3" fill="#7C3AED">HR</text>
</svg>
