<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED" />
      <stop offset="100%" style="stop-color:#0D9488" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="40" height="40" rx="10" fill="url(#favGrad)"/>
  <!-- Left bar -->
  <rect x="7" y="8" width="5.5" height="24" rx="2.5" fill="white"/>
  <!-- Diagonal connector -->
  <polygon points="12.5,8 17.5,8 25,32 20,32" fill="white"/>
  <!-- Right bar -->
  <rect x="20" y="8" width="5.5" height="24" rx="2.5" fill="white"/>
  <!-- Accent dot -->
  <circle cx="30" cy="11" r="3.5" fill="rgba(255,255,255,0.7)"/>
</svg>